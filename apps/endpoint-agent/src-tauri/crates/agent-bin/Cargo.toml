[package]
name = "agent-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agent-core = { path = "../agent-core" }
local-store = { path = "../local-store" }
device-identity = { path = "../device-identity" }
health = { path = "../health" }
segmenter = { path = "../segmenter" }
collection-policy = { path = "../collection-policy" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fs2 = "0.4"
ctrlc = "3"

[target.'cfg(target_os = "macos")'.dependencies]
collector-macos = { path = "../collector-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
collector-windows = { path = "../collector-windows" }

[[bin]]
name = "agent"
path = "src/main.rs"
